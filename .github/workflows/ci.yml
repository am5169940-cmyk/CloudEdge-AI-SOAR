name: Security Platform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Unit Tests & Security Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f log-agent/requirements.txt ]; then pip install -r log-agent/requirements.txt; fi

    - name: Create init file if missing
      run: touch log-agent/tests/__init__.py

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s log-agent/tests -p "test_*.py"

  docker-build-check:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Log Agent Container
      uses: docker/build-push-action@v5
      with:
        context: ./log-agent
        file: ./log-agent/Dockerfile
        push: false

    - name: Build Dashboard Container
      uses: docker/build-push-action@v5
      with:
        context: ./dashboard
        file: ./dashboard/Dockerfile
        push: false
